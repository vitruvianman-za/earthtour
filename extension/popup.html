<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: #15171C; }
    .foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px 10px; background: #15171C;
      font: 11.5px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #7F8EA8;
    }
    .foot button {
      all: unset; cursor: pointer; color: #9AAAC4; text-decoration: underline;
    }
    .foot button:hover { color: #E8EDF5; }
    kbd {
      font: inherit; font-size: 11px; padding: 1px 5px; border-radius: 4px;
      background: rgba(255,255,255,.08); color: #C9D3E3;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="foot">
    <span>On Maps or Earth, press <kbd>Ctrl+K</kbd></span>
    <button id="settings" type="button">Settings</button>
  </div>
  <script src="palette-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
